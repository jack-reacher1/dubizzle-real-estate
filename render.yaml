services:
  - type: web
    name: dubizzle-scraper-worker
    runtime: docker
    dockerfilePath: ./worker/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORKER_TRIGGER_SECRET
        sync: false
      - key: STORAGE_BACKEND
        value: postgres
      - key: ASYNCPG_STATEMENT_CACHE_SIZE
        value: "0"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "10"
      - key: DB_COMMAND_TIMEOUT_SECONDS
        value: "30"
      - key: DB_POOL_MAX_SIZE
        value: "3"
