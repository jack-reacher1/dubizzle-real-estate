name: Daily Dubizzle Scrape

on:
  schedule:
    # GitHub Actions cron uses UTC. These are 02:00, 12:00, and 18:00
    # Cairo time while Egypt is on UTC+3 (summer time).
    - cron: "0 23 * * *" # 02:00 Cairo (next calendar day)
    - cron: "0 9 * * *"  # 12:00 Cairo
    - cron: "0 15 * * *" # 18:00 Cairo
  workflow_dispatch: {}

concurrency:
  group: dubizzle-scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    env:
      DATA_DIR: ${{ vars.DATA_DIR || 'data' }}
      LISTINGS_CSV_NAME: ${{ vars.LISTINGS_CSV_NAME || 'listings.csv' }}
      SELLERS_CSV_NAME: ${{ vars.SELLERS_CSV_NAME || 'sellers_cache.csv' }}
      BUSINESS_CSV_NAME: ${{ vars.BUSINESS_CSV_NAME || 'business_listings.csv' }}
      SCRAPE_STATUS_JSON_NAME: ${{ vars.SCRAPE_STATUS_JSON_NAME || 'scrape_status.json' }}
      DUBIZZLE_BASE_URL: ${{ vars.DUBIZZLE_BASE_URL || 'https://www.dubizzle.com.eg' }}
      DUBIZZLE_SALE_URL: ${{ vars.DUBIZZLE_SALE_URL || 'https://www.dubizzle.com.eg/en/properties/apartments-duplex-for-sale/5th-settlement/' }}
      DUBIZZLE_RENT_URL: ${{ vars.DUBIZZLE_RENT_URL || 'https://www.dubizzle.com.eg/en/properties/apartments-duplex-for-rent/5th-settlement/' }}
      DUBIZZLE_MAX_PAGES: ${{ vars.DUBIZZLE_MAX_PAGES || '25' }}
      DUBIZZLE_FRESHNESS_DAYS: ${{ vars.DUBIZZLE_FRESHNESS_DAYS || '14' }}
      DUBIZZLE_INACTIVE_RETENTION_DAYS: ${{ vars.DUBIZZLE_INACTIVE_RETENTION_DAYS || '30' }}
      OWNER_RECHECK_DAYS: ${{ vars.OWNER_RECHECK_DAYS || '30' }}
      BROKER_ACTIVE_ADS_THRESHOLD: ${{ vars.BROKER_ACTIVE_ADS_THRESHOLD || '4' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Verify generated data
        run: |
          test -s data/listings.csv
          test -s data/sellers_cache.csv
          test -s data/business_listings.csv
          test -s data/scrape_status.json

      - name: Commit updated data
        run: |
          git config user.name "dubizzle-scraper-bot"
          git config user.email "actions@github.com"
          git add data/listings.csv data/sellers_cache.csv data/business_listings.csv data/scrape_status.json
          if git diff --staged --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Scrape: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push origin "${GITHUB_REF_NAME}"
          fi

      - name: Upload scrape status to Postgres (Supabase)
        run: |
          # Guard at runtime: workflow-level expressions cannot reference secrets during validation
          if [ -z "${DATABASE_URL}" ]; then
            echo "DATABASE_URL not set in secrets; skipping upload"
            exit 0
          fi
          python scripts/update_scrape_status.py
